name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job; nothing here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    name: End-to-end + visual regression
    runs-on: ubuntu-latest
    # Same image used to generate the committed baselines (npm run test:e2e:docker).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
      # Build-time env so next build succeeds; the e2e server overrides these.
      DATABASE_URL: file:./e2e.db
      NEXTAUTH_SECRET: ci-build-only
      NEXTAUTH_URL: http://127.0.0.1:3200
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
